[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "praevis-worker"
version = "0.1.0"
description = "Praevis Celery worker"
requires-python = ">=3.11"
dependencies = [
  "celery[redis]>=5.4.0",
  "redis>=5.2.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-json-logger>=2.0.7",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/praevis_worker"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
