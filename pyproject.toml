[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "praevis"
version = "0.1.0"
description = "Praevis AI security gateway monorepo (working codename)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Praevis" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "types-redis>=4.6.0",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests", "apps/worker/tests", "tests"]
pythonpath = [
  "apps/api/src",
  "apps/worker/src",
  "packages/sdk-python/src",
]
markers = [
  "security: security regression and SSRF-related tests",
  "integration: integration tests requiring infra",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api/src", "apps/worker/src", "packages/sdk-python/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "apps/api/src:apps/worker/src:packages/sdk-python/src"
packages = ["praevis_api", "praevis_worker", "praevis_sdk"]
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["celery.*", "redis.*", "bs4.*", "bs4"]
ignore_missing_imports = true
